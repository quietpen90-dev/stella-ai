name: Fix STELLA auth bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix plugin placeholder used by the auth page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          old = 'plugins=%s'
          new = 'plugins=__PLUGIN_DATA__'
          if old not in s:
              raise SystemExit('Expected broken plugin placeholder was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Fix STELLA auth page JavaScript bootstrap'
          git push
